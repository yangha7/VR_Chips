<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VR Chips — Comb Structure v1</title>
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-extras.min.js"></script>
  <script src="libs/aframe-teleport-controls.min.js"></script>
  <script src="sem-terrain.js"></script>
  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('debug-status');
      if (el) el.textContent = 'ERROR: ' + e.message;
    });
    document.addEventListener('DOMContentLoaded', () => {
      const terrain = document.getElementById('terrain');
      terrain.addEventListener('sem-terrain-loaded', () => {
        document.getElementById('debug-status').textContent = 'terrain loaded OK';
      });
    });
  </script>
</head>
<body>
  <div id="debug-status" style="position:fixed; top:0; left:0; z-index:9999; background:black; color:lime; font-family:monospace; padding:4px 8px;">loading…</div>
  <a-scene fog="type: linear; color: #cfe3f0; near: 15; far: 70">

    <a-sky color="#cfe3f0"></a-sky>

    <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; color: #ffffff" position="6 12 4"></a-entity>

    <!-- Spawn floor: a flat, forgiving surface so you never start inside geometry. -->
    <a-plane class="ground" rotation="-90 0 0" width="200" height="200"
             position="0 0 0" material="color: #3a3a3a; shader: flat"></a-plane>

    <!-- The real structure: SEM comb-drive image turned into a walkable relief.
         Dark trench pixels sit near floor level; bright ridge edges from the
         oblique SEM shot rise up as walls between the comb fingers. -->
    <a-entity id="terrain" class="ground"
              position="0 0.01 -20"
              sem-terrain="heightmap: ../assets/processed/comb_height.png;
                           texture: ../assets/processed/comb_texture.jpg;
                           width: 34; depth: 27; maxHeight: 5; resolution: 160">
    </a-entity>

    <a-entity position="0 2.4 -8"
              geometry="primitive: plane; width: 4.2; height: 1.3"
              material="color: #ffffff; opacity: 0.85; shader: flat"
              text="value: SEM image of a MEMS comb-drive actuator.\nYou are walking among structures a few hundred nanometers tall,\nmagnified about 1000x their real size.;
                    width: 3.8; align: center; color: #111111; wrapCount: 34">
    </a-entity>

    <a-entity id="cameraRig" position="0 0 0" movement-controls="speed: 0.15; controls: gamepad, keyboard">
      <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls></a-camera>
      <a-entity id="leftHand" hand-controls="hand: left" oculus-touch-controls="hand: left"
                teleport-controls="cameraRig: #cameraRig; teleportOrigin: #camera; button: trigger; collisionEntities: .ground">
      </a-entity>
      <a-entity id="rightHand" hand-controls="hand: right" oculus-touch-controls="hand: right"
                teleport-controls="cameraRig: #cameraRig; teleportOrigin: #camera; button: trigger; collisionEntities: .ground">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
