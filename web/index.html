<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VR Chips — Comb Structure v1</title>
  <script src="libs/aframe.min.js"></script>
  <script src="libs/aframe-extras.min.js"></script>
  <!-- Cache-bust these two on every deploy (bump ?v=N) -- the headset
       browser has repeatedly kept serving a stale cached copy of these
       after a plain reload, which looks identical to an actual bug. -->
  <script src="sem-terrain.js?v=10"></script>
  <script src="fly-controls.js?v=10"></script>
  <script src="menu-controller.js?v=10"></script>
  <script>
    const log = [];
    function report(msg) {
      log.push(msg);
      const el = document.getElementById('debug-status');
      if (el) el.textContent = log.join('\n');
    }
    window.reportDebug = report;
    window.menuOpen = false;
    window.addEventListener('error', (e) => report('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => report('UNHANDLED REJECTION: ' + e.reason));

    report('fly-controls script version: ' + (window.FLY_CONTROLS_VERSION || 'MISSING (script did not load!)'));
    report('menu-controller script version: ' + (window.MENU_CONTROLLER_VERSION || 'MISSING (script did not load!)'));
    report('xr in navigator: ' + ('xr' in navigator));
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr')
        .then((supported) => report('immersive-vr supported: ' + supported))
        .catch((err) => report('isSessionSupported error: ' + err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const terrain = document.getElementById('terrain');
      terrain.addEventListener('sem-terrain-loaded', () => report('terrain mesh built OK'));

      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', () => report('a-scene fired "loaded"'));
      sceneEl.addEventListener('renderstart', () => report('a-scene fired "renderstart"'));

      setTimeout(() => {
        report('--- 4s check ---');
        report('scene.hasLoaded: ' + sceneEl.hasLoaded);
        const vrButton = document.querySelector('.a-enter-vr-button, .a-enter-vr');
        report('enter-VR button in DOM: ' + !!vrButton);
        if (vrButton) report('enter-VR button display: ' + getComputedStyle(vrButton).display);
      }, 4000);

      // Confirm oculus-touch-controls' resolved model setting whenever a
      // controller actually connects, instead of trusting the HTML
      // attribute took effect -- laser-controls dynamically re-attaches
      // this component on connect and may not preserve it.
      ['leftHand', 'rightHand'].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener('controllerconnected', (e) => {
          setTimeout(() => {
            const comp = el.components['oculus-touch-controls'];
            report(id + ' controllerconnected, name=' + (e.detail && e.detail.name) +
                   ', resolved model=' + (comp ? comp.data.model : 'NO COMPONENT'));
          }, 200);
        });
      });
    });
  </script>
</head>
<body>
  <div id="debug-status" style="position:fixed; top:0; left:0; z-index:9999; background:black; color:lime; font-family:monospace; padding:4px 8px; font-size:12px; white-space:pre-wrap; max-width:90vw;">loading…</div>
  <a-scene fog="type: linear; color: #cfe3f0; near: 15; far: 70">

    <a-sky color="#cfe3f0"></a-sky>

    <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; color: #ffffff" position="6 12 4"></a-entity>

    <!-- Spawn floor: a flat, forgiving surface so you never start inside geometry. -->
    <a-plane class="ground" rotation="-90 0 0" width="200" height="200"
             position="0 0 0" material="color: #3a3a3a; shader: flat"></a-plane>

    <!-- The real structure: SEM comb-drive image turned into a walkable relief.
         Dark trench pixels sit near floor level; bright ridge edges from the
         oblique SEM shot rise up as walls between the comb fingers. -->
    <a-entity id="terrain" class="ground"
              position="0 0.01 -20"
              sem-terrain="heightmap: ../assets/processed/comb_height.png;
                           texture: ../assets/processed/comb_texture.jpg;
                           width: 34; maxHeight: 5; resolution: 260">
    </a-entity>

    <!-- Compact always-visible hint at spawn, so first-time users don't
         need to already know about the grip button to get started. -->
    <a-entity position="0 1.9 -3"
              geometry="primitive: plane; width: 3.4; height: 0.9"
              material="color: #ffffff; opacity: 0.85; shader: flat"
              text="value: Grip: open menu (help / image / choose sample)\nTrigger: fly -- Thumbstick: zoom;
                    width: 3.2; align: center; color: #111111; wrapCount: 40">
    </a-entity>

    <!-- Floating menu: hidden until grip is pressed, then repositioned in
         front of wherever the user currently is (see menu-controller.js). -->
    <a-entity id="menu" visible="false">
      <a-entity geometry="primitive: plane; width: 4.0; height: 2.6"
                material="color: #ffffff; opacity: 0.95; shader: flat"></a-entity>

      <a-entity id="menuPageHelp" position="0 0 0.01" visible="true"
                text="value: ; width: 3.6; align: center; color: #111111; wrapCount: 38">
      </a-entity>

      <a-entity id="menuPageImage" position="0 0 0.01" visible="false">
        <a-entity id="menuImagePlane"
                  geometry="primitive: plane; width: 3.6; height: 2.2"
                  material="src: ../assets/processed/comb_texture.jpg; shader: flat"></a-entity>
      </a-entity>

      <a-entity id="menuPageDatasets" position="0 0.1 0.01" visible="false"
                text="value: ; width: 3.4; align: left; color: #111111; wrapCount: 40">
      </a-entity>

      <a-entity position="0 -1.15 0.01"
                text="value: thumbstick left/right: switch page; color: #666666; align: center; width: 3.4; wrapCount: 44">
      </a-entity>
    </a-entity>

    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls></a-camera>
      <a-entity id="leftHand" laser-controls="hand: left" oculus-touch-controls="hand: left; model: false"
                raycaster="objects: .ground; far: 60" line="color: gold; opacity: 0.75"
                fly-controls="cameraRig: #cameraRig; camera: #camera; terrain: #terrain"
                menu-controller="menu: #menu; camera: #camera; cameraRig: #cameraRig; terrain: #terrain">
      </a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" oculus-touch-controls="hand: right; model: false"
                raycaster="objects: .ground; far: 60" line="color: gold; opacity: 0.75"
                fly-controls="cameraRig: #cameraRig; camera: #camera; terrain: #terrain"
                menu-controller="menu: #menu; camera: #camera; cameraRig: #cameraRig; terrain: #terrain">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
